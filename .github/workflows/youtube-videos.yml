name: Capture Recent YouTube Videos

on:
  schedule:
    - cron: '35 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: youtube-videos
  cancel-in-progress: false

jobs:
  videos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect recent public videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/video-snapshot.py
      - name: Commit recent video snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/recent-videos.json
          git diff --cached --quiet || git commit -m 'chore: update recent YouTube videos'
          git push
