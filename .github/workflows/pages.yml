name: Deploy YouTube Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect latest YouTube snapshot
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          test -n "$YOUTUBE_API_KEY" || { echo "YOUTUBE_API_KEY GitHub secret is missing"; exit 1; }
          python scripts/snapshot.py
          cp data/history/latest.json data/current.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate runtime API config
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          test -n "$YOUTUBE_API_KEY" || { echo "YOUTUBE_API_KEY GitHub secret is missing"; exit 1; }
          node -e "require('fs').writeFileSync('config.js', 'window.YOUTUBE_API_KEY=' + JSON.stringify(process.env.YOUTUBE_API_KEY) + ';\\n')"
          node -e "const fs=require('fs'); const c=fs.readFileSync('config.js','utf8'); if(!c.includes('window.YOUTUBE_API_KEY=') || !c.includes(';')) process.exit(1); console.log('Runtime YouTube API config generated successfully')"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
