name: Capture Competitor YouTube Snapshot

on:
  schedule:
    - cron: '35 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/competitors.json'
      - 'scripts/competitor-snapshot.py'

permissions:
  contents: write

concurrency:
  group: competitor-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect competitor data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/competitor-snapshot.py
      - name: Commit competitor snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/competitors.json
          git diff --cached --quiet || git commit -m 'chore: update competitor YouTube snapshot'
          git push
